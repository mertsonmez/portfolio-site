<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Portfolio</title>
    
    <!-- CSS Dosyaları -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/blog.css">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Portföy</a>
            <ul class="nav-links">
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="index.html#about">Hakkımda</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="index.html#contact">İletişim</a></li>
                <li><button class="theme-toggle" onclick="toggleTheme()">🌓 Tema</button></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>Blog Yazıları</h1>
            <p>Yazılım geliştirme, teknoloji ve deneyimlerim hakkında yazılar</p>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container">
        <!-- Arama ve Filtre -->
        <div class="blog-controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Blog ara..." onkeyup="searchBlogs()">
            </div>
        </div>

        <!-- Kategori Filtreleri -->
        <div class="category-filter" id="categoryFilter">
            <button class="category-btn active" onclick="filterByCategory('all')">Tümü</button>
        </div>

        <!-- Blog Listesi -->
        <div id="blogContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Blog yazıları yükleniyor...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Portfolio. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- JavaScript Dosyaları -->
    <script src="js/theme.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
