<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Detay - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #eee;
            --text-secondary: #bbb;
            --accent: #0f3460;
            --accent-hover: #e94560;
            --border: #2a2a3e;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.8;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: background 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: var(--bg-secondary);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px var(--shadow);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .theme-toggle {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .theme-toggle:hover {
            background: var(--accent-hover);
        }

        .back-button {
            display: inline-block;
            margin: 30px 0 20px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-button:hover {
            color: var(--accent-hover);
        }

        .article-header {
            padding: 40px 0;
            text-align: center;
            border-bottom: 2px solid var(--border);
        }

        .article-category {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .article-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .article-meta {
            display: flex;
            gap: 25px;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1rem;
            flex-wrap: wrap;
        }

        .article-tags {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .tag {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }

        .article-content {
            padding: 60px 0;
        }

        .article-summary {
            font-size: 1.2rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 40px;
            padding: 25px;
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent);
            border-radius: 5px;
        }

        .article-body {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text-primary);
        }

        .article-body p {
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 100px 0;
        }

        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-secondary);
        }

        .share-section {
            padding: 40px 0;
            text-align: center;
            border-top: 2px solid var(--border);
        }

        .share-section h3 {
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .share-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .share-btn {
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: transform 0.3s;
        }

        .share-btn:hover {
            transform: translateY(-2px);
        }

        .share-twitter { background: #1DA1F2; }
        .share-linkedin { background: #0077B5; }
        .share-facebook { background: #1877F2; }

        footer {
            background: var(--bg-secondary);
            padding: 30px 0;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            .article-title {
                font-size: 1.8rem;
            }

            .article-meta {
                flex-direction: column;
                gap: 10px;
            }

            .nav-links {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Portföy</a>
            <ul class="nav-links">
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="index.html#about">Hakkımda</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="index.html#contact">İletişim</a></li>
                <li><button class="theme-toggle" onclick="toggleTheme()">🌓 Tema</button></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <a href="blog.html" class="back-button">← Blog Listesine Dön</a>

        <div id="articleContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Blog yazısı yükleniyor...</p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Portfolio. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script>
        // API URL
        const API_URL = 'https://portfolio-api-production-d4e9.up.railway.app';

        // Tema toggle
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // URL'den blog ID'sini al
        function getBlogId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // Sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            const blogId = getBlogId();
            
            if (!blogId) {
                showError('Blog ID bulunamadı');
                return;
            }
            
            loadBlog(blogId);
        });

        // Blog yazısını yükle
        async function loadBlog(id) {
            try {
                const response = await fetch(`${API_URL}/api/blogs/${id}`);
                const result = await response.json();
                
                if (result.success) {
                    displayBlog(result.data);
                } else {
                    showError(result.message || 'Blog yazısı bulunamadı');
                }
            } catch (error) {
                showError('API bağlantısı başarısız: ' + error.message);
            }
        }

        // Blog yazısını göster
        function displayBlog(blog) {
            const container = document.getElementById('articleContainer');
            
            const date = new Date(blog.publishedDate).toLocaleDateString('tr-TR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // Sayfa başlığını güncelle
            document.title = `${blog.title} - Portfolio`;

            container.innerHTML = `
                <article>
                    <header class="article-header">
                        <div class="article-category">${blog.category}</div>
                        <h1 class="article-title">${blog.title}</h1>
                        <div class="article-meta">
                            <span>👤 ${blog.author}</span>
                            <span>📅 ${date}</span>
                            <span>⏱️ ${blog.readTimeMinutes} dakikalık okuma</span>
                        </div>
                        <div class="article-tags">
                            ${blog.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </header>

                    <div class="article-content">
                        <div class="article-summary">
                            <strong>Özet:</strong> ${blog.summary}
                        </div>
                        <div class="article-body">
                            ${formatContent(blog.content)}
                        </div>
                    </div>

                    <div class="share-section">
                        <h3>Bu yazıyı paylaş</h3>
                        <div class="share-buttons">
                            <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(blog.title)}&url=${encodeURIComponent(window.location.href)}" 
                               target="_blank" 
                               class="share-btn share-twitter">
                                🐦 Twitter
                            </a>
                            <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.href)}" 
                               target="_blank" 
                               class="share-btn share-linkedin">
                                💼 LinkedIn
                            </a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" 
                               target="_blank" 
                               class="share-btn share-facebook">
                                📘 Facebook
                            </a>
                        </div>
                    </div>
                </article>
            `;
        }

        // İçeriği formatla (paragraf ve satır sonlarını işle)
        function formatContent(content) {
            // Basit paragraf formatlaması
            return content
                .split('\n\n')
                .map(para => `<p>${para.trim()}</p>`)
                .join('');
        }

        // Hata göster
        function showError(message) {
            const container = document.getElementById('articleContainer');
            container.innerHTML = `
                <div class="error">
                    <h2>❌ Bir hata oluştu</h2>
                    <p>${message}</p>
                    <p style="margin-top: 20px;">
                        <a href="blog.html" style="color: var(--accent);">Blog listesine dön</a>
                    </p>
                </div>
            `;
        }
    </script>
</body>
</html>
